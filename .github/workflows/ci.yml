name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bericht, kein Gate: die offenen Advisories liegen im Build-/Editor-
      # Tooling (Tina CLI, graphql-codegen, vite), nicht im ausgelieferten Code.
      # Ein hartes Gate waere dauerhaft rot und wuerde deshalb ignoriert.
      - name: Audit dependencies (report)
        run: npm run audit:prod
        continue-on-error: true

      - name: Type check
        run: npm run check

      - name: Build local site
        run: npm run build:local

      - name: SEO audit
        run: npm run audit:seo:dist

      - name: SEO page QA
        run: npm run qa:seo-pages:dist
